name: NPFL daily ingest

# Morning pre-match ingest. Free GitHub Actions minutes only, no paid infra.
# 05:00 UTC = 06:00 WAT (Africa/Lagos).

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      next_limit:
        description: "Upcoming fixtures to ingest"
        default: "20"
      last_limit:
        description: "Recent results to ingest"
        default: "20"
      detail_limit:
        description: "Finished matches to pull lineups/incidents/shotmaps for (1 request group each)"
        default: "5"
      video_url:
        description: "Optional YouTube URL to queue and process now"
        default: ""
      match_id:
        description: "match_id for the optional video"
        default: ""

concurrency:
  group: npfl-daily-ingest
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  TZ: Africa/Lagos
  NPFL_REQUEST_BUDGET: "400"

jobs:
  fixtures:
    name: Scrape NPFL data into Google Sheets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q scrape_npfl.py ingest_youtube.py sheets.py drive_sync.py

      - name: Scrape fixtures, form, lineups and events
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SOFASCORE_NPFL_TOURNAMENT_ID: ${{ secrets.SOFASCORE_NPFL_TOURNAMENT_ID }}
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
          FOOTYSTATS_NPFL_LEAGUE_ID: ${{ secrets.FOOTYSTATS_NPFL_LEAGUE_ID }}
        run: |
          python scrape_npfl.py \
            --next-limit "${{ github.event.inputs.next_limit || '20' }}" \
            --last-limit "${{ github.event.inputs.last_limit || '20' }}" \
            --detail-limit "${{ github.event.inputs.detail_limit || '5' }}" \
            2>&1 | tee scrape.log
          echo "### Scrape tail" >> "$GITHUB_STEP_SUMMARY"
          tail -n 20 scrape.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scrape log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-log
          path: scrape.log
          retention-days: 7

  video:
    name: Extract tactical clips from YouTube transcripts
    runs-on: ubuntu-latest
    needs: fixtures
    if: always() && (needs.fixtures.result == 'success' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Queue the optional video
        if: ${{ github.event.inputs.video_url != '' }}
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python ingest_youtube.py \
            --add "${{ github.event.inputs.video_url }}" \
            --match-id "${{ github.event.inputs.match_id }}"

      - name: Process the video queue
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
        run: |
          python ingest_youtube.py --queue --max-chunks 12 2>&1 | tee video.log
          echo "### Video tail" >> "$GITHUB_STEP_SUMMARY"
          tail -n 20 video.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload video log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-log
          path: video.log
          retention-days: 7

  manual-mirror:
    name: Mirror AGENTS.md to Google Drive (optional)
    runs-on: ubuntu-latest
    needs: fixtures
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync AGENTS.md
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          # drive_sync exits 0 without credentials, so this can never break the run.
          python drive_sync.py --file AGENTS.md
